# Converted from nixos-config/modules/terminal/tmux.nix
#
# The block below reproduces what Home Manager's programs.tmux module generates
# from the declarative options; everything after it is the verbatim extraConfig.

# --- programs.tmux options ---
# set  -g default-terminal "alacritty"        # terminal = "alacritty"
set  -g history-limit 15000                 # historyLimit = 15000
set  -g base-index 1                        # baseIndex = 1
setw -g pane-base-index 1                   # (Home Manager pairs this with baseIndex)
set  -g mouse on                            # mouse = true
set  -s escape-time 20                      # escapeTime = 20
setw -g aggressive-resize on                # (Home Manager default)

# mode-keys: Home Manager's keyMode default is emacs, but the copy-mode-vi
# bindings at the bottom of this file only fire under vi mode.
setw -g mode-keys vi
set  -g status-keys emacs

# --- extraConfig ---
set-option -sa terminal-features ',alacritty:RGB'
set-option -ga terminal-features ",alacritty:usstyle"
set-option -ga terminal-overrides ',alacritty:Tc'

set-option -sa terminal-overrides ',screen-256color:Tc'

set -as terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

bind-key C-b send-prefix

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

unbind Up
unbind Down
unbind Left
unbind Right

bind r source-file ~/.tmux.conf
bind q kill-session

bind-key -r -T prefix Up resize-pane -U
bind-key -r -T prefix Down resize-pane -D
bind-key -r -T prefix Left resize-pane -L
bind-key -r -T prefix Right resize-pane -R
bind-key -r -T prefix S-Up resize-pane -U 5
bind-key -r -T prefix S-Down resize-pane -D 5
bind-key -r -T prefix S-Left resize-pane -L 5
bind-key -r -T prefix S-Right resize-pane -R 5

bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

set -g set-clipboard on
set -g allow-passthrough on
set -as terminal-features ',*:clipboard'
set -g extended-keys on
# set -g extended-keys-format csi-u

bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
